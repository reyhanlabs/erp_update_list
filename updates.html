<!DOCTYPE html>
<html lang="en" data-theme="light" class="pr-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Update History · Zahir ERP</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script>
  (function(){
    var saved = 'auto';
    try { saved = localStorage.getItem('zahir-theme') || 'auto'; } catch(e) {}
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved === 'auto' ? (dark ? 'dark' : 'light') : saved);
  })();
</script>
</head>
<body class="pr-body">
  <header class="pr-top">
    <div class="pr-brand"><img src="/icon.png" alt=""><div><b>Update history</b><small>Zahir ERP · which issues went out in which version</small></div></div>
    <div class="pr-meta" id="prMeta"></div>
  </header>
  <main class="pr-main">
    <div id="updBody"><div class="pr-state"><div class="pr-spin"></div><p>Loading the update history…</p></div></div>
  </main>
  <footer class="pr-foot">Read-only page shared by the Zahir ERP team. Versions come from the Update Summaries; issue status is read from Redmine.</footer>
  <div class="toast" id="toast"></div>
  <script type="module" src="/src/public/updates-page.js"></script>
</body>
</html>
